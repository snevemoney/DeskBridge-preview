<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DeskBridge — iPad UI preview</title>
<style>
:root {
  --bg: #0b0f1a; --panel: #121826; --card: #1a2234; --text: #e8eefc;
  --muted: #8b97b0; --accent: #3d7eff; --warn: #ffb020;
  --device-w: min(920px, 96vw); --device-h: min(680px, 88vh);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; min-height: 100%;
  background:
    radial-gradient(1200px 600px at 20% -10%, #1a2a55 0%, transparent 55%),
    radial-gradient(900px 500px at 90% 20%, #122038 0%, transparent 50%),
    var(--bg);
  color: var(--text);
  font-family: "SF Pro Text", "Segoe UI", system-ui, sans-serif;
}
.stage { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px 40px; gap: 14px; }
.device {
  width: var(--device-w); height: var(--device-h); background: var(--panel);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 28px; overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,0.45); position: relative;
}
.hint { margin: 0; color: var(--muted); font-size: 13px; }
.screen { height: 100%; display: flex; flex-direction: column; }
.nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 10px; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.nav h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
.nav-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.1); background: var(--card); color: var(--text); cursor: pointer;
}
.icon-btn:disabled { opacity: 0.4; cursor: default; }
.content { padding: 14px 18px 24px; overflow: auto; flex: 1; }
.section-label {
  color: var(--muted); font-size: 12px; text-transform: uppercase;
  letter-spacing: 0.06em; margin: 14px 0 8px;
}
.host, .card {
  width: 100%; text-align: left; background: var(--card);
  border: 1px solid rgba(255,255,255,0.06); border-radius: 14px;
  padding: 14px 16px; color: var(--text); margin-bottom: 10px;
}
button.host { cursor: pointer; display: block; }
.host strong { display: block; font-size: 16px; }
.host span { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
.host small { display: block; color: #6d7890; font-size: 12px; margin-top: 6px; }
.host.disabled { opacity: 0.55; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.toggle {
  width: 48px; height: 28px; border-radius: 999px; border: 0;
  background: #2a3348; position: relative; cursor: pointer; flex-shrink: 0;
}
.toggle::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 22px; height: 22px; border-radius: 50%; background: #fff;
  transition: transform 0.15s ease;
}
.toggle.on { background: var(--accent); }
.toggle.on::after { transform: translateX(20px); }
.proto > div {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px;
}
.proto > div:last-child { border-bottom: 0; }
.proto span { color: var(--muted); text-align: right; }
.session { height: 100%; position: relative; overflow: hidden; }
.remote-stub {
  height: 100%; display: grid; place-content: center; text-align: center; gap: 8px;
  background: linear-gradient(145deg, #1e386f, #0d1424 55%); padding: 40px;
}
.remote-stub .glyph { font-size: 56px; }
.remote-stub p { color: var(--muted); margin: 0; max-width: 420px; }
.remote-stub .status { color: #c9d7ff; font-weight: 600; }
.chrome {
  position: absolute; top: 16px; left: 50%;
  transform: translateX(calc(-50% + var(--dx, 0px)));
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  background: rgba(18, 24, 38, 0.82); backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.12); border-radius: 999px;
  max-width: min(720px, 92%); cursor: grab; touch-action: none;
}
.chrome .meta { min-width: 0; }
.chrome .meta strong { display: block; font-size: 13px; }
.chrome .meta span {
  display: block; font-size: 11px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 420px;
}
.chrome .warn { color: var(--warn); font-size: 11px; margin-top: 2px; }
.chrome .actions { display: flex; gap: 6px; }
.chrome .actions button {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.12); background: #243049; color: var(--text); cursor: pointer;
}
.chrome .actions .danger { background: rgba(255,92,92,0.2); color: #ffb0b0; }
.show-controls {
  position: absolute; top: 16px; right: 16px; border: 0; border-radius: 10px;
  padding: 10px 14px; background: var(--accent); color: white; cursor: pointer; font-weight: 600;
}
.row {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px;
}
.row:last-child { border-bottom: 0; }
.row span:last-child { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.primary {
  width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 12px;
  background: var(--accent); color: white; font-weight: 600; cursor: pointer;
}
.footnote { color: var(--muted); font-size: 12px; margin: 8px 2px 0; }
.transfer-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
}
.transfer-item:last-child { border-bottom: 0; }
.badge {
  margin-left: auto; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px;
  background: rgba(61,126,255,0.18); color: #9cbcff;
}
.badge.done { background: rgba(61,214,140,0.18); color: #8ce8b8; }
.badge.na { background: rgba(255,92,92,0.2); color: #ffb0b0; margin-left: 8px; }
</style>
</head>
<body>
<div class="stage">
  <div class="device" id="app" aria-label="DeskBridge iPad preview"></div>
  <p class="hint">Slice 1 UI preview · open protocols only · not Jump Desktop</p>
</div>
<script>
const state = {
  screen: "hosts", returnTo: "hosts", weak: false, chromeHidden: false,
  chromeDx: 0, macros: true, retina: true, audio: true, lockDisplay: true,
};
const app = document.getElementById("app");
function meter() {
  if (state.weak) {
    return { rtt: 180, upload: 4, path: "Direct / LAN", codec: "Software · heavy compress",
      warn: "Weak link — expect slideshow on 4K timelines (hotel / hotspot)." };
  }
  return { rtt: 28, upload: state.retina ? 28 : 32, path: "Direct / LAN",
    codec: "Auto · prefer sharp", warn: null };
}
function go(screen) {
  if (screen === "settings" || screen === "transfer") {
    state.returnTo = (state.screen === "settings" || state.screen === "transfer")
      ? state.returnTo : state.screen;
  }
  state.screen = screen;
  render();
}
function render() {
  if (state.screen === "session") return renderSession();
  if (state.screen === "settings") return renderSettings();
  if (state.screen === "transfer") return renderTransfer();
  return renderHosts();
}
function renderHosts() {
  app.innerHTML = `
    <div class="screen">
      <div class="nav"><h1>DeskBridge</h1>
        <div class="nav-actions">
          <button class="icon-btn" data-go="settings">⚙</button>
          <button class="icon-btn" disabled>＋</button>
        </div>
      </div>
      <div class="content">
        <div class="section-label">Hosts</div>
        <button class="host" data-connect>
          <strong>Home Mac mini</strong>
          <span>Apple Screen Sharing · mac-mini.local:5900</span>
          <small>Ideal: host upload ≥20 Mbps · ping &lt;50 ms</small>
        </button>
        <button class="host" data-connect>
          <strong>Windows box</strong>
          <span>RDP · 192.168.1.50:3389</span>
          <small>RDP · open port 3389 on LAN</small>
        </button>
        <div class="host disabled">
          <strong>Fluid demo <span class="badge na">N/A</span></strong>
          <span>Fluid (unsupported) · blocked</span>
          <small>Jump proprietary — DeskBridge will never implement</small>
        </div>
        <div class="section-label">Network demo</div>
        <div class="card toggle-row">
          <div>
            <strong>Simulate hotel / plane weak link</strong>
            <div style="color:var(--muted);font-size:13px;margin-top:4px">
              Surfaces the review’s slideshow failure mode. Real RTT arrives in slice 2.
            </div>
          </div>
          <button class="toggle ${state.weak ? "on" : ""}" data-weak></button>
        </div>
        <div class="section-label">Protocols</div>
        <div class="card proto">
          <div><strong>VNC</strong><span>RFB · TightVNC / RealVNC / UltraVNC</span></div>
          <div><strong>Apple Screen Sharing</strong><span>macOS Sharing · port 5900</span></div>
          <div><strong>RDP</strong><span>Windows hosts · port 3389</span></div>
          <div><strong>Fluid (unsupported)</strong><span>Jump proprietary — blocked</span></div>
        </div>
      </div>
    </div>`;
  bindHosts();
}
function bindHosts() {
  app.querySelector("[data-weak]")?.addEventListener("click", () => { state.weak = !state.weak; render(); });
  app.querySelector("[data-go='settings']")?.addEventListener("click", () => go("settings"));
  app.querySelectorAll("[data-connect]").forEach((btn) => {
    btn.addEventListener("click", () => { state.chromeHidden = false; state.chromeDx = 0; go("session"); });
  });
}
function renderSession() {
  const m = meter();
  app.innerHTML = `
    <div class="session">
      <div class="remote-stub">
        <div class="glyph">🖥</div>
        <h2 style="margin:0">Remote surface</h2>
        <p class="status">Mock ready (no pixels yet)</p>
        <p>Slice 2: RFB / Screen Sharing pixels via VideoToolbox.</p>
      </div>
      ${state.chromeHidden ? `<button class="show-controls" data-show>Show controls</button>` : `
        <div class="chrome" id="chrome" style="--dx:${state.chromeDx}px">
          <div class="meta">
            <strong>Home Mac mini</strong>
            <span>${m.path} · RTT ~${m.rtt} ms · upload ~${m.upload} Mbps · ${m.codec}</span>
            ${m.warn ? `<div class="warn">${m.warn}</div>` : ""}
          </div>
          <div class="actions">
            <button data-transfer>⇄</button>
            <button data-go="settings">⚙</button>
            <button data-hide>👁</button>
            <button class="danger" data-disconnect>×</button>
          </div>
        </div>`}
    </div>`;
  bindSession();
}
function bindSession() {
  app.querySelector("[data-show]")?.addEventListener("click", () => { state.chromeHidden = false; render(); });
  app.querySelector("[data-hide]")?.addEventListener("click", () => { state.chromeHidden = true; render(); });
  app.querySelector("[data-disconnect]")?.addEventListener("click", () => go("hosts"));
  app.querySelector("[data-transfer]")?.addEventListener("click", () => go("transfer"));
  app.querySelector("[data-go='settings']")?.addEventListener("click", () => go("settings"));
  const chrome = app.querySelector("#chrome");
  if (!chrome) return;
  let startX = 0, origin = state.chromeDx;
  chrome.addEventListener("pointerdown", (e) => { startX = e.clientX; origin = state.chromeDx; chrome.setPointerCapture(e.pointerId); });
  chrome.addEventListener("pointermove", (e) => {
    if (!chrome.hasPointerCapture(e.pointerId)) return;
    state.chromeDx = origin + (e.clientX - startX);
    chrome.style.setProperty("--dx", `${state.chromeDx}px`);
  });
  chrome.addEventListener("pointerup", () => {
    const w = app.clientWidth;
    if (state.chromeDx < -w * 0.15) state.chromeDx = -w * 0.28;
    else if (state.chromeDx > w * 0.15) state.chromeDx = w * 0.28;
    else state.chromeDx = 0;
    chrome.style.setProperty("--dx", `${state.chromeDx}px`);
  });
}
function renderSettings() {
  const macroMap = state.macros
    ? ["Option-Space", "Option-Tab", "Option-Q"]
    : ["Globe-Cmd-Space", "Globe-Cmd-Tab", "Globe-Cmd-Q"];
  const backTo = state.returnTo || "hosts";
  app.innerHTML = `
    <div class="screen">
      <div class="nav"><h1>Session settings</h1>
        <div class="nav-actions"><button class="icon-btn" data-back>✕</button></div>
      </div>
      <div class="content">
        <div class="card toggle-row"><div><strong>Retina</strong></div><button class="toggle ${state.retina ? "on" : ""}" data-k="retina"></button></div>
        <div class="card toggle-row"><div><strong>Audio</strong></div><button class="toggle ${state.audio ? "on" : ""}" data-k="audio"></button></div>
        <div class="card toggle-row"><div><strong>Lock host display</strong></div><button class="toggle ${state.lockDisplay ? "on" : ""}" data-k="lockDisplay"></button></div>
        <div class="card toggle-row"><div><strong>Option macros for stolen shortcuts</strong><div style="color:var(--muted);font-size:12px;margin-top:4px">iPadOS hijacks Cmd-Space / Tab / Q</div></div><button class="toggle ${state.macros ? "on" : ""}" data-k="macros"></button></div>
        <div class="card">
          <div class="row"><span>Cmd-Space → host Spotlight</span><span>${macroMap[0]}</span></div>
          <div class="row"><span>Cmd-Tab → host app switcher</span><span>${macroMap[1]}</span></div>
          <div class="row"><span>Cmd-Q → quit host app</span><span>${macroMap[2]}</span></div>
        </div>
        <p class="footnote">Jump’s menu pill could not be hidden — DeskBridge chrome can.</p>
        <button class="primary" data-back>Done</button>
      </div>
    </div>`;
  app.querySelectorAll("[data-k]").forEach((btn) => {
    btn.addEventListener("click", () => { state[btn.dataset.k] = !state[btn.dataset.k]; render(); });
  });
  app.querySelectorAll("[data-back]").forEach((btn) => {
    btn.addEventListener("click", () => go(backTo));
  });
}
function renderTransfer() {
  app.innerHTML = `
    <div class="screen">
      <div class="nav"><h1>File transfer</h1>
        <div class="nav-actions"><button class="icon-btn" data-back>✕</button></div>
      </div>
      <div class="content">
        <div class="card" style="color:var(--muted);font-size:13px">
          Built-in iPad ↔ host channel — Jump gap from the review (08:27). Slice 1 is a mock queue.
        </div>
        <div class="section-label">Queue</div>
        <div class="card">
          <div class="transfer-item"><span>↑</span><div><strong>project-notes.md</strong><div style="color:var(--muted);font-size:12px">iPad → host</div></div><span class="badge">Ready</span></div>
          <div class="transfer-item"><span>↓</span><div><strong>timeline-proxy.mov</strong><div style="color:var(--muted);font-size:12px">host → iPad</div></div><span class="badge done">Mock done</span></div>
        </div>
        <button class="primary" data-back>Done</button>
      </div>
    </div>`;
  app.querySelectorAll("[data-back]").forEach((btn) => {
    btn.addEventListener("click", () => go("session"));
  });
}
render();
</script>
</body>
</html>
